{{ define "main" }}

<div class="container">

  <h1>Research</h1>

  <h2>Publications</h2>
  <ul>
  {{ range where .Site.RegularPages "Section" "publications" }}
    <li>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    </li>
  {{ end }}
  </ul>

  <hr>

  <h2>Working Papers</h2>
  <ul>
  {{ range where .Site.RegularPages "Section" "working-papers" }}
    <li>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    </li>
  {{ end }}
  </ul>

</div>

{{ end }}
